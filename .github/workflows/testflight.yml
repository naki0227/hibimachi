name: TestFlight
# Manual only: archives a Release build (ad-hoc signed), signs it for the App Store with a cloud-managed
# distribution certificate through an App Store Connect API key and uploads it to TestFlight. Required repository secrets (see docs/QUALITY-CI.md):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (contents of the .p8 file), APPLE_TEAM_ID
on:
  workflow_dispatch:
    inputs:
      ref_note:
        description: "What to test in this build (shown in the run name only)"
        required: false
        default: ""

run-name: "TestFlight ${{ github.ref_name }} ${{ inputs.ref_note }}"

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      # Build numbers only ever go up; offset keeps them above any build uploaded by hand from Xcode.
      BUILD_NUMBER: ${{ github.run_number }}0
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi
      - name: Write API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      # The archive is only ad-hoc signed: automatic signing here made Apple issue a new development certificate
      # on every fresh runner until the account hit its limit (2026-11-02). The real signature comes from the
      # export below, with a cloud-managed distribution certificate, so no certificate is created per run.
      - name: Archive (Release, ad-hoc signed)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Hibimachi.xcodeproj -scheme Hibimachi -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/Hibimachi.xcarchive \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO AD_HOC_CODE_SIGNING_ALLOWED=YES \
            PROVISIONING_PROFILE_SPECIFIER= \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
      # Re-signing keeps the entitlements of the archived binaries; without the App Group the widget could not
      # read the save, so stop here rather than upload such a build.
      - name: Check App Group entitlements
        run: |
          app="build/Hibimachi.xcarchive/Products/Applications/Hibimachi.app"
          for binary in "$app" "$app/PlugIns/HibimachiWidgetExtension.appex"; do
            entitlements=$(codesign -d --entitlements - --xml "$binary" 2>/dev/null || true)
            if ! printf '%s' "$entitlements" | grep -q "group.com.enludus.hibimachi"; then
              echo "::error::$binary is missing the App Group entitlement"
              exit 1
            fi
          done
      - name: Export and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          sed "s/TEAM_ID_PLACEHOLDER/$APPLE_TEAM_ID/" scripts/ci/ExportOptions-TestFlight.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath build/Hibimachi.xcarchive -exportPath build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
      - name: Summary
        run: echo "Uploaded build $BUILD_NUMBER. It appears in TestFlight after Apple finishes processing (usually 5-30 min)." >> "$GITHUB_STEP_SUMMARY"
