name: Docs quality
on:
  push:
    branches: [main]
  pull_request:
jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate documentation
        run: |
          python3 scripts/verify_docs.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
